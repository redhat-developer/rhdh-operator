name: Sync Lightspeed Configs

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  sync-lightspeed:
    name: Sync Lightspeed Configs (${{ matrix.branch }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        branch:
          - release-1.10

    concurrency:
      group: ${{ github.workflow }}-${{ matrix.branch }}
      cancel-in-progress: true

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'

      - name: Set up yq
        uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4.53.6
        with:
          cmd: yq --version

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync Lightspeed Core config files
        run: |
          if [[ "${{ matrix.branch }}" == "release-1.10" ]]; then
            ./hack/sync-lightspeed-configs.sh --repo redhat-ai-dev/lightspeed-configs --ref ${{ matrix.branch }}
          else
            ./hack/sync-lightspeed-configs.sh --ref ${{ matrix.branch }}
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet config/profile/rhdh/default-config/flavours/intelligent-assistant/ examples/intelligent-assistant.yaml; then
            echo "No changes from upstream."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected from upstream."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate manifests
        if: steps.changes.outputs.has_changes == 'true'
        run: make bundles build-installers

      - name: Commit changes and open PR
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ matrix.branch }}
        run: |
          TITLE="chore(lightspeed): sync config files from upstream"
          BRANCH="chore/sync-lightspeed-configs-${TARGET_BRANCH}"
          TARGET_REPO="redhat-developer/rhdh-intelligent-assistant-configs"
          
          if [[ "${TARGET_BRANCH}" == "release-1.10" ]]; then
            TARGET_REPO="redhat-ai-dev/lightspeed-configs"
          fi

          EXISTING_PR=$(gh pr list --head "${BRANCH}" --base "${TARGET_BRANCH}" --state open --json number --jq '.[0].number // empty')

          git checkout -b "${BRANCH}"

          git add -A
          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi
          git commit -m "${TITLE}"

          if [ -n "${EXISTING_PR}" ]; then
            echo "Updating existing PR #${EXISTING_PR}."
            git push --force origin "${BRANCH}"
          else
            git push origin "${BRANCH}"

            BODY=$(cat <<EOF
          Automated nightly sync of Lightspeed Core config files from [${TARGET_REPO} @ ${TARGET_BRANCH}](https://github.com/${TARGET_REPO}/tree/${TARGET_BRANCH}).

          ### Synced files
          - \`config/profile/rhdh/default-config/flavours/intelligent-assistant/configmap-files.yaml\`
          - \`examples/intelligent-assistant.yaml\`

          > [!CAUTION]
          > Please review the upstream changes carefully before merging.
          EOF
            )

            gh pr create \
              --title "${TITLE}" \
              --body "${BODY}" \
              --base "${TARGET_BRANCH}"
          fi
