name: EOL release branch

on:
  # Any release tag (x.y.z). Tags in this repo look like 2.1.0 / 2.1.1 (no "v" prefix).
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  # Manual replay, and the one-off backfill for 2.1.0 -> release-1.9.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag that just shipped (e.g. 2.1.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: eol-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  eol-release:
    name: EOL after ${{ github.event.inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout main (tags needed to compute the EOL branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Validate tag format
        run: |
          if [[ ! "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${TAG} is not a release tag (expected x.y.z)"
            exit 1
          fi

      - name: Compute EOL branch and update config files
        id: eol
        run: |
          ./hack/eol-release.sh --tag "${TAG}" --write | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Open pull request
        if: steps.eol.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EOL_BRANCH: ${{ steps.eol.outputs.eol_branch }}
          EOL_VERSION: ${{ steps.eol.outputs.eol_version }}
        run: |
          set -euo pipefail
          if [[ -z "${EOL_BRANCH}" || -z "${EOL_VERSION}" ]]; then
            echo "::error::EOL_BRANCH or EOL_VERSION is empty"
            exit 1
          fi
          BRANCH="chore/eol-${EOL_BRANCH}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          git stash push --include-untracked -m "generated EOL changes"
          git rebase origin/main
          git stash pop
          git checkout -B "${BRANCH}"
          git add .github/workflows/nightly.yaml \
                  .github/renovate.json
          git commit -m "chore(ci): end of life ${EOL_BRANCH} after ${TAG}"
          git push --force origin "${BRANCH}"

          BODY=$(cat <<EOF
          Automated end-of-life for \`${EOL_BRANCH}\`, triggered by the \`${TAG}\` release tag.

          - [x] Removed from the nightly matrix
          - [x] Removed from the standard upgrade paths
          - [x] Checked the PostgreSQL upgrade matrix
          - [x] Renovate rule added (\`enabled: false\`)

          > [!NOTE]
          > Generated by \`.github/workflows/eol-release.yaml\`. The branch itself is not
          > deleted by this automation.
          EOF
          )

          EXISTING=$(gh pr list --head "${BRANCH}" --base main --state open \
                       --json number --jq '.[0].number // empty')
          if [[ -n "${EXISTING}" ]]; then
            echo "Updating existing PR #${EXISTING}."
            gh pr comment "${EXISTING}" --body "Re-ran for \`${TAG}\`."
          else
            gh pr create \
              --title "chore(ci): end of life ${EOL_BRANCH} after ${TAG}" \
              --body "${BODY}" \
              --base main
          fi
