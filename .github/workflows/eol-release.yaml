---
name: EOL release branch

"on":
  # release tags (x.y.0). Tags in this repo look like 2.1.0 (no "v" prefix).
  push:
    tags:
      - '[0-9]*.[0-9]*.0'
  # Manual replay, and the one-off backfill for 2.1.0 -> release-1.9.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag that just shipped (e.g. 2.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: eol-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  eol-release:
    name: EOL after ${{ github.event.inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout main (tags needed to compute the EOL branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag format
        id: validate-tag
        run: |
          if [[ ! "${TAG}" =~ ^[0-9]+\.[0-9]+\.0$ ]]; then
            echo "::notice::${TAG} is not a release tag;" \
              "skipping EOL processing"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Verify tag exists in the checkout
        if: steps.validate-tag.outputs.valid == 'true'
        run: |
          if ! git show-ref --verify --quiet "refs/tags/${TAG}"; then
            echo "::error::${TAG} does not exist in the fetched repository tags"
            exit 1
          fi

      - name: Compute EOL branch and update config files
        if: steps.validate-tag.outputs.valid == 'true'
        id: eol
        run: |
          ./hack/eol-release.sh --tag "${TAG}" --write \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Require GitHub App credentials
        if: steps.eol.outputs.changed == 'true'
        env:
          APP_ID: ${{ secrets.RHDH_GITHUB_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RHDH_GITHUB_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "${APP_ID}" || -z "${APP_PRIVATE_KEY}" ]]; then
            echo "::error::RHDH_GITHUB_APP_ID and RHDH_GITHUB_APP_PRIVATE_KEY" \
              "must be configured"
            exit 1
          fi
      - name: Generate GitHub App token
        if: steps.eol.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.RHDH_GITHUB_APP_ID }}
          private-key: ${{ secrets.RHDH_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Open pull request
        if: steps.eol.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPOSITORY: ${{ github.repository }}
          EOL_BRANCH: ${{ steps.eol.outputs.eol_branch }}
          EOL_VERSION: ${{ steps.eol.outputs.eol_version }}
        run: |
          set -euo pipefail
          if [[ -z "${EOL_BRANCH}" || -z "${EOL_VERSION}" ]]; then
            echo "::error::EOL_BRANCH or EOL_VERSION is empty"
            exit 1
          fi
          BRANCH="chore/eol-${EOL_BRANCH}"

          APP_BOT_LOGIN="${APP_SLUG}[bot]"
          APP_BOT_ID="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"

          git config user.name "${APP_BOT_LOGIN}"
          git config user.email \
            "${APP_BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"

          git pull --rebase --autostash origin main
          git checkout -B "${BRANCH}"
          git add .github/workflows/nightly.yaml \
                  .github/workflows/nightly-upgrade-test.yaml \
                  .github/renovate.json
          git commit -m "chore(ci): end of life ${EOL_BRANCH} after ${TAG}"
          git push --force origin "${BRANCH}"

          BODY=$(cat <<EOF
          Automated end-of-life for \`${EOL_BRANCH}\`, triggered by the
          \`${TAG}\` release tag.

          - [x] Removed from the nightly matrix
          - [x] Removed from the standard upgrade paths
          - [x] Left `nightly-postgresql-upgrade-test.yaml` untouched
          - [x] Renovate rule added (\`enabled: false\`)

          > [!NOTE]
          > Generated by \`.github/workflows/eol-release.yaml\`.
          > The branch itself is not deleted by this automation.
          EOF
          )

          EXISTING=$(gh pr list --head "${BRANCH}" --base main --state open \
                       --json number --jq '.[0].number // empty')
          if [[ -n "${EXISTING}" ]]; then
            echo "Updating existing PR #${EXISTING}."
            gh pr comment "${EXISTING}" --body "Re-ran for \`${TAG}\`."
          else
            gh pr create \
              --title "chore(ci): end of life ${EOL_BRANCH} after ${TAG}" \
              --body "${BODY}" \
              --base main
          fi
