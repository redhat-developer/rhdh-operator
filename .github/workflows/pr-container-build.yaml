name: PR Container Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - 'release-[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ vars.REGISTRY || 'quay.io' }}
  REGISTRY_ORG: ${{ vars.REGISTRY_ORG || 'rhdh-community' }}
  OPERATOR_IMAGE_NAME: ${{ vars.OPERATOR_IMAGE_NAME || 'operator' }}

jobs:
  pr-build:
    name: Build PR Container Images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            .github/workflows/pr-container-build.yaml
            .github/workflows/pr-container-push.yaml
            .github/actions/docker-build/**
            Makefile
            **/*.go
            bundle/**
            config/**
            go.mod
            go.sum
            LICENSE
            **/Dockerfile
            **/Containerfile
            **/*.Dockerfile
            **/.dockerignore
            rpms.in.yaml
            rpms.lock.yaml
            scripts/**
          files_ignore: |
            **/*.md
            **/*.adoc
            .rhdh/**
            tests/**

      - name: Setup Go
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'

      - name: Prepare build variables
        if: steps.changed-files.outputs.any_changed == 'true'
        id: prep
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${PR_HEAD_SHA:0:7}"
          BASE_VERSION=$(grep -E "^VERSION \?=" Makefile | sed -r -e "s/.+= //")
          VERSION="${BASE_VERSION}-pr-${PR_NUM}-${SHORT_SHA}"

          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "BASE_VERSION=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build operator image (hermetic)
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: ./.github/actions/docker-build
        with:
          imageName: ${{ env.REGISTRY }}/${{ env.REGISTRY_ORG }}/${{ env.OPERATOR_IMAGE_NAME }}
          imageTags: type=raw,value=${{ steps.prep.outputs.VERSION }}
          imageLabels: quay.expires-after=7d
          platform: linux/amd64
          skipArtifactUpload: 'true'

      - name: Build bundle image
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          CONTAINER_TOOL: podman
          VERSION: ${{ steps.prep.outputs.VERSION }}
          IMAGE_TAG_BASE: ${{ env.REGISTRY }}/${{ env.REGISTRY_ORG }}/${{ env.OPERATOR_IMAGE_NAME }}
        run: |
          make bundle bundle-build

      - name: Save images to tarballs
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          VERSION: ${{ steps.prep.outputs.VERSION }}
        run: |
          set -euo pipefail
          OPERATOR_IMG="${REGISTRY}/${REGISTRY_ORG}/${OPERATOR_IMAGE_NAME}:${VERSION}"
          BUNDLE_IMG="${REGISTRY}/${REGISTRY_ORG}/${OPERATOR_IMAGE_NAME}-bundle:${VERSION}"

          podman save "${OPERATOR_IMG}" | gzip > operator-image.tar.gz
          podman save "${BUNDLE_IMG}" | gzip > bundle-image.tar.gz

      - name: Create metadata
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_VERSION: ${{ steps.prep.outputs.BASE_VERSION }}
          SHORT_SHA: ${{ steps.prep.outputs.SHORT_SHA }}
        run: |
          jq -n \
            --argjson pr "$PR_NUMBER" \
            --arg bv "$BASE_VERSION" \
            --arg ss "$SHORT_SHA" \
            '{pr_number: $pr, base_version: $bv, short_sha: $ss}' > metadata.json

      - name: Upload image artifact
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-images
          path: |
            operator-image.tar.gz
            bundle-image.tar.gz
            metadata.json
          retention-days: 1

      - name: Summary
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          VERSION: ${{ steps.prep.outputs.VERSION }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          echo "### Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **PR Number**: ${PR_NUM}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: Built and saved as artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The images will be pushed by the PR Container Push workflow." >> "$GITHUB_STEP_SUMMARY"
