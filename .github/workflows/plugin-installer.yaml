name: Plugin Installer CI

on:
  push:
    branches:
      - main
    paths:
      - 'plugin-installer/**'
      - '.github/workflows/plugin-installer.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'plugin-installer/**'
      - '.github/workflows/plugin-installer.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: quay.io
  IMAGE_NAME: rhdh-community/plugin-installer

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install skopeo

      - name: Run unit tests
        run: ./plugin-installer/install_plugins_test.sh

      - name: Run integration tests
        run: RUN_INTEGRATION_TESTS=true ./plugin-installer/install_plugins_test.sh

  build-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get short SHA
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Login to registry (${{ env.REGISTRY }})
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build and push image
        run: |
          sudo apt-get -y update
          sudo apt-get -y install skopeo podman

          export CONTAINER_TOOL=podman
          export INSTALL_DP_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:next

          # Build the image
          make install-dp-build

          # Push with multiple tags: next and next-<sha>
          podman push -q ${INSTALL_DP_IMAGE}
          skopeo --insecure-policy copy --all \
            docker://${INSTALL_DP_IMAGE} \
            docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:next-${{ env.SHORT_SHA }}
