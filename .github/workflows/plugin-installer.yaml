name: Plugin Installer CI

on:
  push:
    branches:
      - main
      - 'release-[2-9]+.[0-9]+'
    paths:
      - 'plugin-installer/**'
      - '.github/workflows/plugin-installer.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'plugin-installer/**'
      - '.github/workflows/plugin-installer.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ vars.REGISTRY }}

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install skopeo

      - name: Run tests
        run: RUN_INTEGRATION_TESTS=true ./plugin-installer/install_plugins_test.sh

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image (PR validation)
        if: github.event_name == 'pull_request'
        run: make install-dp-build

      - name: Set up QEMU
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to registry (${{ env.REGISTRY }})
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build and push multiplatform image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: make install-dp-buildx
