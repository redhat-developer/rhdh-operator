name: PR Dockerfile Validation (Hermetic)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - 'main'
      - 'release-[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  validate-dockerfile:
    name: Validate Dockerfile (Hermetic Build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            .github/workflows/pr-dockerbuild-validation.yaml
            .github/actions/docker-build/**
            Makefile
            **/*.go
            bundle/**
            config/**
            go.mod
            go.sum
            LICENSE
            **/Dockerfile
            **/Containerfile
            **/*.Dockerfile
            **/.dockerignore
            rpms.in.yaml
            rpms.lock.yaml
            scripts/**
          files_ignore: |
            **/*.md
            **/*.adoc
            .rhdh/**
            tests/**

      - name: Build operator image (hermetic)
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: ./.github/actions/docker-build
        with:
          imageName: localhost/operator
          imageTags: type=raw,value=validate
          platform: linux/amd64
          skipArtifactUpload: 'true'
