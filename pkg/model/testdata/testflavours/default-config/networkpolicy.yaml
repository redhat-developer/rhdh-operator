apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector:
    matchLabels:
      rhdh.redhat.com/app: "" # placeholder for 'backstage-<cr-name>'
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
spec:
  podSelector:
    matchLabels:
      rhdh.redhat.com/app: "" # placeholder for 'backstage-<cr-name>'
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-https-egress
spec:
  podSelector:
    matchLabels:
      rhdh.redhat.com/app: "" # placeholder for 'backstage-<cr-name>'
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-psql-egress
spec:
  podSelector:
    matchLabels:
      rhdh.redhat.com/app: "" # placeholder for 'backstage-<cr-name>'
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              rhdh.redhat.com/app: "" # placeholder for 'backstage-psql-<cr-name>'
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-ingress
spec:
  podSelector:
    matchLabels:
      rhdh.redhat.com/app: "" # placeholder for 'backstage-<cr-name>'
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
      ports:
        - port: 9464
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-router-ingress
spec:
  podSelector:
    matchLabels:
      rhdh.redhat.com/app: "" # placeholder for 'backstage-<cr-name>'
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {} # on OCP, replaced with policy-group.network.openshift.io/ingress selector
      ports:
        - port: 7007
          protocol: TCP
