apiVersion: v1
data:
  dynamic-plugins.yaml: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: default-dynamic-plugins
    data:
      dynamic-plugins.yaml: |
        plugins:
          - package: 'ref://red-hat-developer-hub-backstage-plugin-orchestrator'
            enabled: true
          - package: 'ref://red-hat-developer-hub-backstage-plugin-orchestrator-backend'
            enabled: true
            dependencies:
              - ref: sonataflow
          - package: 'ref://red-hat-developer-hub-backstage-plugin-scaffolder-backend-module-orchestrator'
            enabled: true
          - package: 'ref://red-hat-developer-hub-backstage-plugin-orchestrator-form-widgets'
            enabled: true
  metadata.yaml: |
    # Orchestrator flavour metadata
    # This flavour is disabled by default due to heavy infrastructure dependencies
    # (requires Tekton, ArgoCD, Serverless Workflow Operator)
    enabledByDefault: false
  networkpolicy.yaml: |
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: allow-infra-ns-to-sonataflow
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/managed-by: sonataflow-operator
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  # Allow knative events to be delivered to workflows.
                  kubernetes.io/metadata.name: knative-eventing
            - namespaceSelector:
                matchLabels:
                  # Allow auxiliary knative function for workflow (such as m2k-save-transformation)
                  kubernetes.io/metadata.name: knative-serving
            - namespaceSelector:
                matchLabels:
                  # Allow openshift serverless logic operator controller pod to access SonataFlow pods
                  kubernetes.io/metadata.name: openshift-serverless-logic
    ---
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: allow-router-ingress-to-sonataflow
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/managed-by: sonataflow-operator
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  # Allow OpenShift Router / ingress controller to reach SonataFlow pods.
                  policy-group.network.openshift.io/ingress: ""
          ports:
            - port: 80
              protocol: TCP
    ---
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: allow-backstage-to-sonataflow
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/managed-by: sonataflow-operator
      # Specify policy type as 'Ingress' to control incoming traffic rules
      policyTypes:
        - Ingress
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  # Placeholder that will be replaced with the actual label used by the backstage pod
                  rhdh.redhat.com/app: backstage
          ports:
            - port: 80
              protocol: TCP
    ---
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: allow-sonataflow-intra
    spec:
      podSelector:
        matchLabels:
          # Allow SonataFlow pods to communicate with each other
          app.kubernetes.io/managed-by: sonataflow-operator
      policyTypes:
        - Ingress
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/managed-by: sonataflow-operator
          ports:
            - port: 80
              protocol: TCP
    ---
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: allow-monitoring-to-sonataflow
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/managed-by: sonataflow-operator
      # Specify policy type as 'Ingress' to control incoming traffic rules
      policyTypes:
        - Ingress
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  # Allow openshift-user-workload-monitoring pods to access SonataFlow pods
                  kubernetes.io/metadata.name: openshift-user-workload-monitoring
    ---
    # Allow all egress from SonataFlow-managed pods.
    # SonataFlow workflows may need arbitrary outbound access.
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: allow-sonataflow-all-egress
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/managed-by: sonataflow-operator
      policyTypes:
        - Egress
      egress:
        - {}
    ---
    # Allow the Orchestrator backend plugin to reach SonataFlow / Data Index services.
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: allow-backstage-to-sonataflow-egress
    spec:
      podSelector:
        matchLabels:
          # Placeholder that will be replaced with the actual label used by the backstage pod
          rhdh.redhat.com/app: backstage
      policyTypes:
        - Egress
      egress:
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/managed-by: sonataflow-operator
          ports:
            - port: 80
              protocol: TCP
kind: ConfigMap
metadata:
  name: rhdh-flavour-orchestrator-config
