data:
  configmap-files.yaml: "kind: ConfigMap\napiVersion: v1\nmetadata:\n  name: llama-stack-config\n
    \ annotations:\n    rhdh.redhat.com/containers: \"lightspeed-core\"\n    rhdh.redhat.com/mount-path:
    \"/app-root\"\n    rhdh.redhat.com/sub-path: \"*\"\ndata:\n  config.yaml: |\n
    \   #\n    #\n    # Copyright Red Hat\n    #\n    # Licensed under the Apache
