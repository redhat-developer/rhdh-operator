apiVersion: v1
kind: Namespace
metadata:
  name: openshift-serverless
  labels:
    rhdh.redhat.com/managed-by: plugin-infra
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: serverless-operator-installer
  namespace: openshift-serverless
  labels:
    rhdh.redhat.com/managed-by: plugin-infra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: serverless-operator-installer-binding
  labels:
    rhdh.redhat.com/managed-by: plugin-infra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: serverless-operator-installer
    namespace: openshift-serverless
---
apiVersion: olm.operatorframework.io/v1
kind: ClusterExtension
metadata:
  name: serverless-operator
  labels:
    rhdh.redhat.com/managed-by: plugin-infra
spec:
  install:
    preflight:
      crdUpgradeSafety:
        enforcement: None
  namespace: openshift-serverless
  serviceAccount:
    name: serverless-operator-installer
  source:
    sourceType: Catalog
    catalog:
      packageName: serverless-operator
      channels:
        - stable
      selector:
        matchLabels:
          olm.operatorframework.io/metadata.name: openshift-redhat-operators
      upgradeConstraintPolicy: CatalogProvided
