apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator
  labels:
    app: rhdh-operator
    app.kubernetes.io/part-of: rhdh
spec:
  selector:
    matchLabels:
      app: rhdh-operator
  template:
    metadata:
      labels:
        app: rhdh-operator
        app.kubernetes.io/component: rhdh-operator
    spec:
      containers:
        - name: manager
          env:
            - name: OPERATOR_NAME
              value: rhdh-operator
            - name: OPERATOR_DP_PROCESSING
              value: "false"
            - name: RELATED_IMAGE_postgresql
              value: quay.io/fedora/postgresql-18:latest
            - name: RELATED_IMAGE_backstage
              value: quay.io/rhdh-community/rhdh:next
            # The images below are used by the default configuration flavours and plugin
            # dependencies. They are listed here so that operator-sdk publishes them in
            # the spec.relatedImages section of the bundle.
            - name: RELATED_IMAGE_lightspeed_core
              value: quay.io/lightspeed-core/lightspeed-stack:0.7.3
            - name: RELATED_IMAGE_plugin_dep_okp
              value: registry.redhat.io/offline-knowledge-portal/rhokp-rhel9:1.3.0-1793303796
            - name: RELATED_IMAGE_ubi_minimal
              value: registry.access.redhat.com/ubi10-minimal:10.1
            - name: RELATED_IMAGE_tekton_git
              value: registry.access.redhat.com/hi/git:2.56.0
          volumeMounts:
            - mountPath: /default-config/flavours/intelligent-assistant
              name: flavour-intelligent-assistant-config
            - mountPath: /default-config/flavours/intelligent-assistant-okp
              name: flavour-intelligent-assistant-okp-config
            - mountPath: /default-config/flavours/orchestrator
              name: flavour-orchestrator-config
      volumes:
        - name: flavour-intelligent-assistant-config
          configMap:
            name: flavour-intelligent-assistant-config
        - name: flavour-intelligent-assistant-okp-config
          configMap:
            name: flavour-intelligent-assistant-okp-config
        - name: flavour-orchestrator-config
          configMap:
            name: flavour-orchestrator-config
