apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector:
    matchLabels:
      rhdh.redhat.com/app: backstage # replaced at runtime with 'backstage-<cr-name>'
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
spec:
  podSelector:
    matchLabels:
      rhdh.redhat.com/app: backstage # replaced at runtime with 'backstage-<cr-name>'
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-https-egress
spec:
  podSelector:
    matchLabels:
      rhdh.redhat.com/app: backstage # replaced at runtime with 'backstage-<cr-name>'
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-psql-egress
spec:
  podSelector:
    matchLabels:
      rhdh.redhat.com/app: backstage # replaced at runtime with 'backstage-<cr-name>'
  policyTypes:
    - Egress
  egress:
    - to:
        # When local DB is disabled (external DB), this 'to' selector is removed at runtime,
        # allowing egress on port 5432 to any destination.
        - podSelector:
            matchLabels:
              rhdh.redhat.com/app: backstage-psql # replaced at runtime with 'backstage-psql-<cr-name>'
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-ingress
spec:
  podSelector:
    matchLabels:
      rhdh.redhat.com/app: backstage # replaced at runtime with 'backstage-<cr-name>'
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              # OpenShift platform monitoring
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              # GKE: Google Managed Prometheus
              kubernetes.io/metadata.name: gmp-system
        - namespaceSelector:
            matchLabels:
              # kube-prometheus-stack convention
              kubernetes.io/metadata.name: monitoring
        # AKS runs its monitoring agent in kube-system, but allowing all of kube-system
        # is too broad; it contains many non-monitoring system components.
        # AKS users should create an additive NetworkPolicy targeting kube-system if needed.
        #- namespaceSelector:
        #    matchLabels:
        #      kubernetes.io/metadata.name: kube-system
      ports:
        - port: 9464
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-router-ingress
spec:
  podSelector:
    matchLabels:
      rhdh.redhat.com/app: backstage # replaced at runtime with 'backstage-<cr-name>'
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {} # on OCP, replaced with policy-group.network.openshift.io/ingress selector
      ports:
        - port: 7007
          protocol: TCP
---
# The following db-* policies are only created when the local DB is enabled in the CR.
# They are filtered out at runtime when spec.database.enableLocalDb is false.
