# NetworkPolicy to allow the Backstage pod to access OKP when the add-on flavour is enabled.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-okp-egress
spec:
  podSelector:
    matchLabels:
      rhdh.redhat.com/app: backstage # replaced at runtime with 'backstage-<cr-name>'
  policyTypes:
    - Egress
  egress:
    # Allow HTTP egress on port 80 (for an OKP external Route or Ingress).
    - ports:
        - protocol: TCP
          port: 80
    # Allow HTTP egress on port 8080 (for the OKP internal Service or an external endpoint using :8080).
    - ports:
        - protocol: TCP
          port: 8080
