apiVersion: apps/v1
kind: Deployment
spec:
  template:
    spec:
      containers:
        # Lightspeed Core Backend
        - name: lightspeed-core
          image: quay.io/lightspeed-core/lightspeed-stack:0.7.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
              name: lcs-backend
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          args:
            - "--synthesized-config-output"
            - "/tmp/.generated/run.yaml"
          env:
            - name: HF_HOME
              value: /tmp/hf_cache
            - name: KV_STORE_PATH
              value: /tmp/kvstore.db
            - name: SQL_STORE_PATH
              value: /tmp/sql_store.db
            - name: SQLITE_STORE_DIR
              value: /tmp/llama-stack-files
            - name: OTEL_SDK_DISABLED
              value: "true"
          volumeMounts:
            - mountPath: /tmp
              name: lightspeed-data

      volumes:
        - name: lightspeed-data
          emptyDir: { }
