# Default-deny for SonataFlow Data Index pods created by the operator.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sonataflow-data-index-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: data-index-service
      app.kubernetes.io/managed-by: sonataflow-operator
  policyTypes:
    - Ingress
    - Egress
---
# Default-deny for SonataFlow Jobs Service pods created by the operator.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sonataflow-jobs-service-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jobs-service
      app.kubernetes.io/managed-by: sonataflow-operator
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-infra-ns-to-sonataflow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: sonataflow-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              # Allow knative events to be delivered to workflows.
              kubernetes.io/metadata.name: knative-eventing
        - namespaceSelector:
            matchLabels:
              # Allow auxiliary knative function for workflow (such as m2k-save-transformation)
              kubernetes.io/metadata.name: knative-serving
        - namespaceSelector:
            matchLabels:
              # Allow openshift serverless logic operator controller pod to access SonataFlow pods
              kubernetes.io/metadata.name: openshift-serverless-logic
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-router-ingress-to-sonataflow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: sonataflow-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              # Allow OpenShift Router / ingress controller to reach SonataFlow pods.
              policy-group.network.openshift.io/ingress: ""
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backstage-to-sonataflow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: sonataflow-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              # Placeholder that will be replaced with the actual label used by the backstage pod
              rhdh.redhat.com/app: backstage
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sonataflow-intra
spec:
  podSelector:
    matchLabels:
      # Allow SonataFlow pods to communicate with each other
      app.kubernetes.io/managed-by: sonataflow-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: sonataflow-operator
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: sonataflow-operator
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: sonataflow-operator
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: sonataflow-operator
---
# Allow DNS egress from SonataFlow-managed pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sonataflow-dns-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: sonataflow-operator
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        # mDNS; used by some CNI plugins and node-local DNS caches (e.g. on OpenShift)
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
---
# Allow HTTPS and Kubernetes API egress from SonataFlow-managed pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sonataflow-https-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: sonataflow-operator
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
        # Kubernetes API server (e.g., OpenShift uses 6443; some managed platforms use 443 above).
        - port: 6443
          protocol: TCP
---
# Allow SonataFlow-managed pods to reach PostgreSQL.
# When local DB is disabled, the 'to' selector is removed at runtime (same as allow-psql-egress), allowing egress on port 5432 to any destination.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sonataflow-postgresql-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: sonataflow-operator
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              rhdh.redhat.com/app: backstage-psql # replaced at runtime with 'backstage-psql-<cr-name>'
      ports:
        - port: 5432
          protocol: TCP
---
# Allow SonataFlow-managed pods to call RHDH APIs on port 7007.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sonataflow-to-backstage-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: sonataflow-operator
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              rhdh.redhat.com/app: backstage # replaced at runtime with 'backstage-<cr-name>'
      ports:
        - port: 7007
          protocol: TCP
---
# Allow SonataFlow-managed pods to reach the RHDH backend on port 7007 (matching egress).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sonataflow-to-backstage-ingress
spec:
  podSelector:
    matchLabels:
      rhdh.redhat.com/app: backstage # replaced at runtime with 'backstage-<cr-name>'
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: sonataflow-operator
      ports:
        - port: 7007
          protocol: TCP
---
# Allow the Orchestrator backend plugin to reach SonataFlow / Data Index services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backstage-to-sonataflow-egress
spec:
  podSelector:
    matchLabels:
      # Placeholder that will be replaced with the actual label used by the backstage pod
      rhdh.redhat.com/app: backstage
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: sonataflow-operator
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-to-sonataflow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: sonataflow-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gmp-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gke-gmp-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
---
# Allow SonataFlow services and the DB-creation job to reach the local PostgreSQL used by the Orchestrator.
# Filtered out at runtime when local DB is disabled (DB-scoped podSelector).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sonataflow-to-db-ingress
spec:
  podSelector:
    matchLabels:
      rhdh.redhat.com/app: backstage-psql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: sonataflow-operator
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: sonataflow-operator
        - podSelector:
            matchLabels:
              rhdh.redhat.com/app: create-sonataflow-database
      ports:
        - port: 5432
          protocol: TCP