# TODO(asoro): these Orchestrator policies use podSelector: {} (namespace-wide) and conflict with
# the ADR's "default deny with selective allow" and "label-scoped policies" principles.
# They weaken per-component ingress isolation for RHDH backend and DB pods in the same namespace.
# Even though only one Orchestrator-flavoured RHDH instance is supported per namespace (the
# SonataFlow Operator enforces one SonataFlowPlatform per namespace), a non-Orchestrator RHDH
# instance could coexist in the same namespace; these namespace-wide policies would affect it too.
# Review and make stricter by scoping to SonataFlow-specific labels where possible.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-infra-ns-to-workflow-ns
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              # Allow knative events to be delivered to workflows.
              kubernetes.io/metadata.name: knative-eventing
        - namespaceSelector:
            matchLabels:
              # Allow auxiliary knative function for workflow (such as m2k-save-transformation)
              kubernetes.io/metadata.name: knative-serving
        - namespaceSelector:
            matchLabels:
              # Allow openshift serverless logic operator controller pod to access all pods in sonataflow
              kubernetes.io/metadata.name: openshift-serverless-logic
---
# NetworkPolicy to unblock incoming traffic to the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-communication
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              # Allow knative events to be delivered to workflows.
              policy-group.network.openshift.io/ingress: ""
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-network
spec:
  # Apply this policy to all pods in the namespace
  podSelector: {}
  # Specify policy type as 'Ingress' to control incoming traffic rules
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Allow ingress from any pod within the same namespace
        - podSelector: {}
---
# NetworkPolicy to allow openshift-user-workload-monitoring pods to access all pods within the workflow's namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-to-sonataflow-and-workflows
spec:
  # Apply this policy to all pods in the namespace
  podSelector: {}
  # Specify policy type as 'Ingress' to control incoming traffic rules
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              # Allow openshift-user-workload-monitoring pods to access the workflow.
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
